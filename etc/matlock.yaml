---
# matlock configuration
#
# These are the system-wide defaults; per-user overrides go in
# $XDG_CONFIG_HOME/matlock/matlock.yaml (usually ~/.config/matlock/matlock.yaml).
# Changes to either file are applied live, even while the screen is locked.
#
# Only the flat "key: value" form shown here is supported.

# background colour ("#RRGGBB")
background: "#141D1A"

# fontconfig pattern for the rain glyphs (both backends)
font_pattern: monospace

# pixel size of the closest rain layer (10..128); the farther layers
# interpolate linearly down to 10
font_size: 20

# number of depth layers (1..8): closer layers are larger, brighter,
# faster and longer
depth_levels: 4

# size of the droplet pool (16..20000)
max_droplets: 1000

# longest stream, in characters (2..200)
droplet_length: 50

# droplet spawn attempts per simulation step (1..32), 1-in-5 chance each;
# this is the main density knob -- raise it for heavier rain
spawn_attempts: 1

# animation frame rate (10..120). The simulation is rescaled so the
# on-screen speed, density and mutation rate are the same at any value;
# lower means less CPU with coarser motion. On HiDPI Wayland outputs,
# "hidpi: false" below cuts CPU far more than lowering this.
fps: 20

# freeze the animation after this many seconds without input (0..86400,
# 0 disables, the default); when set, the process sleeps at ~0% CPU until a
# key press (or, on X11, a pointer move) resumes it
idle_timeout: 0

# render at the output's full buffer scale on HiDPI displays; set false to
# render at scale 1 and let the compositor upscale (less CPU and memory on
# Retina-class outputs, at some crispness cost; Wayland only)
hidpi: true

# characters the streams are made of (printable ASCII, no spaces; written
# unquoted because the set contains both quote characters)
charset: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789~`!@#$%^&*()_+-=[]{}\;:'",<.>/?

# characters in the falling columns mutate as they fall
mutate_chars: true

# treat cleared input as a failed attempt (colour feedback)
failonclear: false

# rain colours per state ("#RRGGBB")
fontcolour:
    init: "#1cff7b"
    input: "#28a99e"
    failed: "#E28743"
...
